name: Build APK

on:
  push:
    branches: [ main, 'ui/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleGithubDebug
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AGP 8.12.x 要求 JDK 17（项目默认的 JDK 8 不行）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 必须先接受许可证，否则 sdkmanager 安装会卡住/失败
      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      # compileSdk 36 / targetSdk 36 必须显式安装平台；两个 build-tools 都装，
      # 免去猜 AGP 8.12.3 默认取哪个版本。
      - name: Install SDK platform 36
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 仓库里 gradlew 的 mode 是 100644，Linux runner 上不可执行
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Show environment
        run: |
          java -version
          ./gradlew --version
          echo "ANDROID_HOME=$ANDROID_HOME"

      # 单独跑一次依赖解析并允许失败，把真实原因完整留在日志里，
      # 避免被后续编译错误掩盖。
      - name: Resolve dependencies (diagnostic)
        continue-on-error: true
        run: ./gradlew :app:dependencies --configuration githubDebugRuntimeClasspath --stacktrace

      - name: Assemble
        run: ./gradlew :app:assembleGithubDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vhosts-github-debug
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: warn
